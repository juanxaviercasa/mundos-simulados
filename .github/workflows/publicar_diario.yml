name: Publicar entradas estáticas

on:
  schedule:
    - cron: '0 13 * * *' # 08:00 en Perú; GitHub puede retrasar el inicio
    - cron: '0 18 * * *' # 13:00 en Perú
    - cron: '0 23 * * *' # 18:00 en Perú
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests python-frontmatter markdown beautifulsoup4 Pillow

      - name: Ejecutar SSG (Publicación Estática)
        run: python publicar_estatico.py

      - name: Commit de los borradores eliminados y HTML generado
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatización: post convertido a estático y publicado" && git push)
