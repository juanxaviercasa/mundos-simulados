name: Publicar Artículos en WordPress

on:
  schedule:
    - cron: '0 13 * * *' # Mañana (13:00 UTC / 8:00 AM EST)
    - cron: '0 18 * * *' # Tarde (18:00 UTC / 1:00 PM EST)
    - cron: '0 23 * * *' # Noche (23:00 UTC / 6:00 PM EST)
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests python-frontmatter markdown beautifulsoup4

      - name: Ejecutar SSG (Publicación Estática)
        run: python publicar_estatico.py

      - name: Commit de los borradores eliminados y HTML generado
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add borradores/ mundossimuladosexport/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatización: 1 post convertido a estático y publicado" && git push)
