name: Generador Editorial Autónomo con IA (SEO & GEO)

on:
  schedule:
    # Corre todos los días a las 06:00 UTC (01:00 AM hora Perú/Colombia)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      cantidad:
        description: 'Número de artículos a generar'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '6'
      categoria:
        description: 'Categoría a investigar'
        required: true
        default: 'astrofisica'
        type: choice
        options:
          - 'astrofisica'
          - 'tecnologia'
          - 'biosfera'
          - 'economia'
      publicar_wp:
        description: 'Subir como borrador a WordPress'
        required: true
        default: true
        type: boolean

jobs:
  generar_contenido:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          pip install requests python-frontmatter markdown pandas google-generativeai python-dotenv

      - name: Ejecutar Generador Autónomo con IA y Motores de Búsqueda
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL || 'https://dev-simulandomundos.pantheonsite.io' }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_SEO_PLUGIN: rankmath
        run: |
          CANTIDAD="${{ github.event.inputs.cantidad || '3' }}"
          CATEGORIA="${{ github.event.inputs.categoria || 'astrofisica' }}"
          PUBLICAR="${{ github.event.inputs.publicar_wp != 'false' && '--publicar' || '' }}"
          python 04_crear_nueva_entrada.py --lote "$CANTIDAD" --categoria "$CATEGORIA" $PUBLICAR

      - name: Guardar Nuevos Artículos Markdown en el Repositorio
        run: |
          git config --global user.name "MundosSimulados Bot"
          git config --global user.email "bot@mundossimulados.online"
          git add articulos/*.md
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Contenido IA: Nuevos artículos generados automáticamente con SEO & GEO"
          git push || true
